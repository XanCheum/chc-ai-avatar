<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first: scale to device width, allow the visitor to zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet Ah Ying – Chinatown Heritage Centre</title>
  <meta name="description" content="Talk to Ah Ying, a fictional Samsui woman from old Chinatown. A prototype storyteller for the Chinatown Heritage Centre." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ============================================================
       START SCREEN
       Shown first. The Start tap is required so that mobile
       browsers allow speech audio to play (autoplay is blocked
       until the user interacts with the page).
       ============================================================ -->
  <section id="start-screen" class="screen start-screen">
    <h1 id="start-title" class="title">Meet Ah Ying</h1>
    <p id="start-subtitle" class="subtitle">Talk to a Samsui woman from old Chinatown</p>
    <button id="start-btn" class="btn btn-primary btn-large" type="button">Start</button>
    <p class="disclaimer">Prototype – fictional character based on CHC stories</p>
  </section>

  <!-- ============================================================
       CONVERSATION SCREEN
       Shown after the visitor taps Start. Contains the avatar,
       the chat history, the question controls and the survey.
       ============================================================ -->
  <section id="chat-screen" class="screen chat-screen" hidden>

    <!-- Top bar: avatar media frame + controls -->
    <header class="chat-header">
      <!-- Avatar media frame. Shows a photo by default; plays videos
           (greeting / per-story / fallback) in the same box when they
           are available. When a video is missing or fails to load the
           code falls back to the photo + browser text-to-speech, with
           a gentle breathing zoom and animated sound bars.
           Animation is driven by the .speaking class toggled from app.js. -->
      <div class="avatar-wrap">
        <div id="avatar" class="avatar">
          <!-- Default photo. alt text is refined from the character name by app.js. -->
          <img id="avatar-photo" class="avatar-photo" src="content/ah-ying.jpg"
               alt="Ah Ying, a Samsui woman" />

          <!-- Video layer. playsinline keeps it inline on iPhone Safari.
               No autoplay: playback is started from JS after the Start tap
               so sound is not blocked. Hidden until a video actually plays. -->
          <video id="avatar-video" class="avatar-video" playsinline webkit-playsinline
                 preload="auto" hidden></video>

          <!-- Animated sound bars, shown only while TTS is speaking. -->
          <div id="sound-bars" class="sound-bars" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>

          <!-- On-screen subtitles for the current greeting/answer text. -->
          <div id="avatar-subtitle" class="avatar-subtitle" aria-live="polite"></div>
        </div>
        <!-- Required disclosure that the character is AI-generated. -->
        <p class="media-caption">AI-generated character (fictional)</p>
      </div>

      <div class="header-controls">
        <!-- Mute toggle. Text + aria-pressed updated from app.js. -->
        <button id="mute-btn" class="btn btn-icon" type="button" aria-pressed="false" aria-label="Mute speech">🔊 Sound on</button>
        <!-- Language toggle: hidden unless _zh content exists. -->
        <button id="lang-btn" class="btn btn-icon" type="button" hidden></button>
      </div>
    </header>

    <!-- Chat history: visitor and avatar bubbles are appended here -->
    <main id="chat-log" class="chat-log" aria-live="polite" aria-label="Conversation with Ah Ying"></main>

    <!-- Question controls -->
    <div class="controls">
      <!-- Suggested questions, one button per story, built in app.js -->
      <div id="suggestions" class="suggestions" aria-label="Suggested questions"></div>

      <!-- Typed question input -->
      <form id="ask-form" class="ask-form" autocomplete="off">
        <!-- Microphone button: hidden unless SpeechRecognition is supported -->
        <button id="mic-btn" class="btn btn-icon" type="button" aria-label="Ask by voice" hidden>🎤</button>
        <label class="visually-hidden" for="ask-input">Type your question</label>
        <input id="ask-input" class="ask-input" type="text" placeholder="Type a question…" inputmode="text" />
        <button id="send-btn" class="btn btn-primary" type="submit">Send</button>
      </form>

      <!-- Survey call to action -->
      <button id="survey-btn" class="btn btn-secondary btn-large" type="button">Finish &amp; share feedback</button>
      <p id="survey-msg" class="survey-msg" hidden>Survey link coming soon</p>
    </div>

    <p class="disclaimer">Prototype – fictional character based on CHC stories</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
